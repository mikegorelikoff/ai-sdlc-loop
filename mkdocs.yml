site_name: AI SDLC Loop
site_description: A smaller approval-gated AI SDLC delivery cycle with deterministic TOON evidence.
site_url: https://mikegorelikoff.github.io/ai-sdlc-loop/
repo_url: https://github.com/mikegorelikoff/ai-sdlc-loop
repo_name: mikegorelikoff/ai-sdlc-loop

theme:
  name: material
  language: en
  features:
    - navigation.footer
    - navigation.indexes
    - navigation.sections
    - navigation.top
    - content.code.copy

extra_css:
  - assets/stylesheets/ai-sdlc.css

markdown_extensions:
  - admonition
  - attr_list
  - md_in_html
  - pymdownx.details
  - pymdownx.highlight
  - pymdownx.superfences

nav:
  - Home: index.md
  - Start here:
      - start-here.md
      - Prerequisites: prerequisites.md
      - First run: first-run.md
  - How it works:
      - how-it-works.md
      - Workflow: workflow.md
      - Authority and evidence: authority-evidence.md
  - Guides:
      - guides/index.md
      - Install Loop: guides/install.md
      - Deliver a first change: guides/first-change.md
      - Use guided Flow: guides/flow.md
      - Diagnose an installation: guides/doctor.md
      - Prepare a release: guides/release.md
  - Reference:
      - reference/index.md
      - Skills: reference/skills.md
      - Commands: reference/commands.md
      - Contracts: reference/contracts.md
      - Supported environments: reference/environments.md
  - Project:
      - project/index.md
      - Security and privacy: project/security.md
      - Decision log: project/decision-log.md
      - Roadmap: project/roadmap.md
