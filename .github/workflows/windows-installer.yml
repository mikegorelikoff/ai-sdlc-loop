name: Windows installer

on:
  push:
    branches: [main, 'feature/**']
    tags: ['v*.*.*']
    paths:
      - 'packaging/windows/**'
      - 'install.py'
      - 'skills/**'
      - 'tests/**'
      - '.github/workflows/windows-installer.yml'
  pull_request:
    paths:
      - 'packaging/windows/**'
      - 'install.py'
      - 'skills/**'
      - 'tests/**'
      - '.github/workflows/windows-installer.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: windows-2025
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          architecture: x64
      - name: Install hash-locked build dependencies
        run: python -m pip install --require-hashes -r packaging/windows/requirements.lock
      - name: Test installer contracts
        run: python -m unittest tests.test_install tests.test_windows_installer -v
      - name: Build self-contained installer
        run: python packaging/windows/build.py
      - name: Test packaged EXE without Python on PATH
        run: python packaging/windows/smoke.py dist/ai-sdlc-loop-0.10.0-windows-x64-setup.exe
      - uses: actions/upload-artifact@v4
        with:
          name: windows-installer
          path: |
            dist/*.exe
            dist/*.sha256
          if-no-files-found: error

  release:
    if: startsWith(github.ref, 'refs/tags/')
    needs: build
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - name: Verify version matches tag
        env:
          RELEASE_TAG: ${{ github.ref_name }}
        run: python -c 'import os, runpy; assert os.environ["RELEASE_TAG"] == "v" + runpy.run_path("packaging/windows/launcher.py")["VERSION"]'
      - uses: actions/download-artifact@v4
        with:
          name: windows-installer
          path: dist
      - name: Publish verified installer and checksum
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ github.ref_name }}
        run: gh release create "$RELEASE_TAG" dist/*.exe dist/*.sha256 --verify-tag --title "AI SDLC Loop $RELEASE_TAG" --notes-file packaging/windows/release-notes.md
