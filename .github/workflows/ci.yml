name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: python -m unittest discover -s tests -v
      - run: python -m compileall -q install.py skills tests
      - if: runner.os != 'Windows'
        run: sh -n install.sh

  context-graph:
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        include:
          - python-version: "3.10"
            parser-lock: parser-lock-linux-cp310.toon
          - python-version: "3.13"
            parser-lock: parser-lock-linux-cp313.toon
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Download exact graph runtime wheels
        run: >-
          python -m pip download --only-binary=:all: --no-deps
          --dest "$RUNNER_TEMP/ai-sdlc-graph-wheelhouse"
          tree-sitter==0.25.2
          tree-sitter-typescript==0.23.2
          tree-sitter-python==0.25.0
          tree-sitter-javascript==0.25.0
          tree-sitter-java==0.23.5
          tree-sitter-c-sharp==0.23.5
          tree-sitter-php==0.24.1
          tree-sitter-bash==0.25.1
          tree-sitter-cpp==0.23.4
          tree-sitter-go==0.25.0
          tree-sitter-rust==0.24.2
          tree-sitter-kotlin==1.1.0
          tree-sitter-swift==0.7.3
      - name: Verify and install graph runtime offline
        run: >-
          python skills/ai-sdlc-loop-context-cache/scripts/install_graph_runtime.py
          --lock skills/ai-sdlc-loop-context-cache/references/${{ matrix.parser-lock }}
          --wheelhouse "$RUNNER_TEMP/ai-sdlc-graph-wheelhouse"
      - name: Prove offline graph preflight
        run: >-
          python skills/ai-sdlc-loop-context-cache/tests/install_graph_smoke.py
          --lock skills/ai-sdlc-loop-context-cache/references/${{ matrix.parser-lock }}
          --wheelhouse "$RUNNER_TEMP/ai-sdlc-graph-wheelhouse"
          --offline --format toon
      - name: Run inherited twelve-language graph regressions
        run: python -m unittest discover -s skills/ai-sdlc-loop-context-cache/tests -p 'test*.py' -v
